<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Pérdidas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column vh-100" style="background: #f8fafc;">

<div class="container py-5 flex-grow-1" style="max-width: 680px;">
  <div class="text-center mb-5">
    <div class="d-inline-flex align-items-center gap-2">
      <h2 class="fw-bold mb-0">Calculadora de Pérdidas</h2>
      <button type="button"
              class="btn btn-outline-secondary btn-sm"
              data-bs-toggle="modal"
              data-bs-target="#modalInstructivo"
              title="Instrucciones">
        ℹ️
      </button>
    </div>
    <p class="text-muted mt-2">Arrastra uno o varios archivos CSV del datalogger para calcular las pérdidas del día.</p>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" enctype="multipart/form-data" id="upload-form">
    {% csrf_token %}
    <div class="mb-3">
      <label for ="nombre-planta" class="form-label">Nombre de la planta</label>
      <input type="text"
             class="form-control"
             id="nombre-planta"
             name="nombre_planta"
             placeholder="Ej: Khoury Industrial" 
             required>
    </div>
    <div id="drop-zone"
         style="border: 2px dashed #2B6CB0; border-radius: 12px; padding: 60px 20px;
                text-align: center; cursor: pointer; background: #f0f6ff; transition: background 0.2s;">
      <div style="font-size: 3rem; margin-bottom: 12px;">📂</div>
      <p style="font-size: 1.1rem; color: #2B6CB0; font-weight: 500;" id="drop-label">
        Arrastra los archivos aquí
      </p>
      <p class="text-muted small">o haz clic para seleccionarlos</p>
    </div>

    <div id="file-list" class="mt-3"></div>
    <div id="avisos-validacion" class="mt-2" style="display:none;"></div>

    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-primary btn-lg" id="submit-btn" disabled>
        <span id="btn-texto">Calcular pérdidas</span>
        <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2" role="status" style="display:none;"></span>
      </button>
    </div>
  </form>
</div>

<div class="w-100 text-center py-3 border-top bg-white text-muted small">
  © 2026
</div>

{% include "calculadora/partials/instructivo.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const dropZone  = document.getElementById('drop-zone');
  const fileList  = document.getElementById('file-list');
  const submitBtn = document.getElementById('submit-btn');
  const dropLabel = document.getElementById('drop-label');
  const form      = document.getElementById('upload-form');

  const LIMITE_ARCHIVOS = 31;
  let archivosAcumulados = [];

  dropZone.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.csv';
    input.addEventListener('change', () => agregarArchivos(input.files));
    input.click();
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.style.background = '#dbeafe';
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.style.background = '#f0f6ff';
  });

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.background = '#f0f6ff';
    agregarArchivos(e.dataTransfer.files);
  });

  function mostrarAviso(mensaje, tipo = 'warning') {
    const avisos = document.getElementById('avisos-validacion');
    avisos.innerHTML = `<div class="alert alert-${tipo} py-2 mb-1 small">${mensaje}</div>`;
    avisos.style.display = 'block';
    setTimeout(() => { avisos.innerHTML = ''; avisos.style.display = 'none'; }, 4000);
  }

  function agregarArchivos(files) {
    const nombresExistentes = new Set(archivosAcumulados.map(f => f.name));
    const disponibles = LIMITE_ARCHIVOS - archivosAcumulados.length;

    if (disponibles <= 0) {
      mostrarAviso(`Límite alcanzado: máximo ${LIMITE_ARCHIVOS} archivos por análisis.`, 'danger');
      return;
    }

    let agregados = 0;
    for (const file of files) {
      if (archivosAcumulados.length >= LIMITE_ARCHIVOS) {
        mostrarAviso(`Límite alcanzado: se agregaron ${agregados} archivo(s). Máximo ${LIMITE_ARCHIVOS} por análisis.`, 'warning');
        break;
      }
      if (!nombresExistentes.has(file.name)) {
        archivosAcumulados.push(file);
        nombresExistentes.add(file.name);
        agregados++;
      }
    }

    renderLista();
  }

  function eliminarArchivo(nombre) {
    archivosAcumulados = archivosAcumulados.filter(f => f.name !== nombre);
    renderLista();
  }

  function renderLista() {
    fileList.innerHTML = '';

    if (!archivosAcumulados.length) {
      submitBtn.disabled = true;
      dropLabel.textContent = 'Arrastra los archivos aquí';
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list-group';

    archivosAcumulados.forEach(f => {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex align-items-center gap-2';
      li.innerHTML = `
        <span>📄</span>
        <span class="flex-grow-1">${f.name}</span>
        <span class="text-muted small me-2">${(f.size / 1024).toFixed(1)} KB</span>
        <button type="button"
                onclick="eliminarArchivo('${f.name}')"
                class="btn btn-sm btn-outline-danger px-2 py-0"
                title="Quitar archivo">✕</button>
      `;
      ul.appendChild(li);
    });

    fileList.appendChild(ul);
    dropLabel.textContent = `${archivosAcumulados.length} / ${LIMITE_ARCHIVOS} archivo(s) seleccionado(s)`;
    submitBtn.disabled = false;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const nombrePlanta = document.getElementById('nombre-planta').value.trim();
    if (!nombrePlanta) {
      mostrarAviso('Por favor, ingresa el nombre de la planta.', 'danger');
      return;
    }

    if (!archivosAcumulados.length) return;

    document.getElementById('btn-texto').textContent = 'Procesando...';
    document.getElementById('btn-spinner').style.display = 'inline-block';
    submitBtn.disabled = true;
    const formData = new FormData(form);
    archivosAcumulados.forEach(f => formData.append('archivos_csv', f));

    fetch(form.action || window.location.href, {
      method: 'POST',
      body: formData,
    }).then(response => {
      if (response.redirected) {
        window.location.href = response.url;
      } else {
        return response.text().then(html => {
          document.open();
          document.write(html);
          document.close();
        });
      }
    }).catch(() => {
      document.getElementById('btn-texto').textContent = 'Calcular pérdidas';
      document.getElementById('btn-spinner').style.display = 'none';
      submitBtn.disabled = false;
    });
  });
</script>
</body>
</html>
